<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まなびスタジアム 演出サンプル</title>
<style>
@font-face{font-family:MR;src:url(__FONT_MR__) format("woff");font-weight:800}
@font-face{font-family:DG;src:url(__FONT_DG__) format("woff")}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:MR,sans-serif;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;background:#000}
#gl canvas{position:absolute;inset:0;width:1280px!important;height:720px!important}
.ov{position:absolute;pointer-events:none}
/* シネマの黒帯 */
#letter::before,#letter::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s}
#letter::before{top:0}#letter::after{bottom:0}
#letter.on::before,#letter.on::after{height:64px}
#letter{inset:0}
/* 実況テロップ */
#telop{left:140px;right:140px;bottom:26px;height:84px;border-radius:18px;background:linear-gradient(180deg,rgba(15,25,70,.92),rgba(30,15,60,.92));border:4px solid #ffe066;box-shadow:0 6px 0 rgba(0,0,0,.4);display:flex;align-items:center;padding:0 28px 0 172px;opacity:0;transform:translateY(30px);transition:.35s;z-index:5}
#telop.on{opacity:1;transform:none}
#telop::before{content:"じっきょう";position:absolute;left:18px;top:50%;transform:translateY(-50%);background:#ff6b6b;color:#fff;font-size:20px;padding:6px 10px;border-radius:10px}
#telopText{white-space:nowrap;color:#fff;font-size:36px;letter-spacing:.04em;text-shadow:0 3px 0 #000}
/* HP */
#hud{left:0;right:0;top:20px;height:90px;opacity:0;transition:.4s;z-index:4}
#hud.on{opacity:1}
.side{position:absolute;top:0;width:520px;height:80px;display:flex;align-items:center;gap:14px}
#sA{left:30px}#sB{right:30px;flex-direction:row-reverse}
.side img{width:80px;height:80px;image-rendering:pixelated;background:rgba(0,0,0,.45);border-radius:50%;border:4px solid #fff}
.bar{flex:1}.nm{color:#fff;font-size:28px;text-shadow:0 3px 0 #000;margin-bottom:6px}
#sB .nm{text-align:right}
.hp{height:26px;border-radius:13px;background:rgba(0,0,0,.6);border:3px solid #fff;overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
#hpA{background:linear-gradient(90deg,#4dabf7,#99e9f2)}
#hpB{background:linear-gradient(270deg,#ff6b6b,#ffc9a8);margin-left:auto}
/* VS */
#vs{left:50%;top:44%;font-size:220px;color:#ffe066;-webkit-text-stroke:10px #b5179e;paint-order:stroke;transform:translate(-50%,-50%) scale(0);opacity:0;z-index:6;font-weight:800}
#vs.on{animation:vs 1.6s forwards}
@keyframes vs{0%{transform:translate(-50%,-50%) scale(4);opacity:0}15%{transform:translate(-50%,-50%) scale(.9);opacity:1}25%{transform:translate(-50%,-50%) scale(1.05)}75%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
/* カットイン */
#cutin{left:-200px;right:-200px;top:200px;height:300px;transform:skewY(-8deg) scaleY(0);background:linear-gradient(90deg,#0b3d91,#4dabf7 50%,#0b3d91);border-top:8px solid #fff;border-bottom:8px solid #fff;transition:transform .25s;z-index:7;overflow:hidden}
#cutin.on{transform:skewY(-8deg) scaleY(1)}
#cutin::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 70px);animation:speed .3s linear infinite}
@keyframes speed{to{background-position:-140px 0}}
#cutImg{position:absolute;left:260px;top:-40px;height:380px;image-rendering:pixelated;transform:skewY(8deg) translateX(-600px);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
#cutin.on #cutImg{transform:skewY(8deg) translateX(0)}
#cutTxt{position:absolute;right:300px;top:90px;font-size:96px;color:#fff;-webkit-text-stroke:8px #0b1d50;paint-order:stroke;transform:skewY(8deg) translateX(600px);transition:transform .45s .1s cubic-bezier(.2,.9,.2,1);font-weight:800}
#cutin.on #cutTxt{transform:skewY(8deg) translateX(0)}
/* ダメージ */
#dmg{font-size:110px;color:#fff;-webkit-text-stroke:9px #c92a2a;paint-order:stroke;transform:translate(-50%,-50%) scale(0);z-index:6;font-weight:800}
#dmg.on{animation:dmg 1.6s forwards}
@keyframes dmg{0%{transform:translate(-50%,-50%) scale(2.5)}12%{transform:translate(-50%,-50%) scale(.9)}20%{transform:translate(-50%,-50%) scale(1.05)}80%{transform:translate(-50%,-80%) scale(1);opacity:1}100%{transform:translate(-50%,-100%) scale(1);opacity:0}}
#flash{inset:0;background:#fff;opacity:0;z-index:8}
#fps{right:12px;bottom:6px;color:#9f9;font:16px monospace;z-index:9;text-shadow:0 1px 0 #000}
/* はじめ・おわり */
.panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;z-index:10;color:#fff;text-align:center}
.panel.on{display:flex}
#start{background:radial-gradient(circle,rgba(30,40,110,.75),rgba(0,0,0,.92))}
#start h1{font-size:72px;margin:0;color:#ffe066;-webkit-text-stroke:6px #4c1d95;paint-order:stroke}
#start p{font-size:26px;margin:0;opacity:.9}
button{font-family:MR,sans-serif;font-size:34px;padding:18px 44px;border-radius:999px;border:5px solid #fff;background:#ff6b6b;color:#fff;cursor:pointer;box-shadow:0 6px 0 #a61e4d}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a61e4d}
#end{background:rgba(0,0,0,.55);justify-content:flex-end;padding-bottom:150px;box-sizing:border-box}
#end .row{display:flex;gap:24px}
#mode{background:#4dabf7;box-shadow:0 6px 0 #1864ab}
#result{font-size:26px;background:rgba(0,0,0,.6);padding:10px 22px;border-radius:12px}
#renderer{font-size:14px;opacity:.6}
#credit{position:absolute;left:12px;bottom:6px;font-size:13px;color:rgba(255,255,255,.55);z-index:9}
</style>
</head>
<body>
<div id="stage">
  <div id="gl"></div>
  <div id="letter" class="ov"></div>
  <div id="hud" class="ov">
    <div class="side" id="sA"><img id="iconA"><div class="bar"><div class="nm" id="nameA"></div><div class="hp"><i id="hpA"></i></div></div></div>
    <div class="side" id="sB"><img id="iconB"><div class="bar"><div class="nm" id="nameB"></div><div class="hp"><i id="hpB"></i></div></div></div>
  </div>
  <div id="vs" class="ov">VS</div>
  <div id="cutin" class="ov"><img id="cutImg"><div id="cutTxt">パワーシュート！</div></div>
  <div id="dmg" class="ov"></div>
  <div id="telop" class="ov"><div id="telopText"></div></div>
  <div id="flash" class="ov"></div>
  <div id="fps" class="ov"></div>
  <div id="credit">音楽：MusMus　ディレクション・ゲームデザイン・企画 K.nom</div>
  <div id="start" class="panel on">
    <h1>まなびスタジアム</h1>
    <p>演出サンプル（3Dスタジアム）　音が出ます</p>
    <button id="startBtn">タップで はじまる</button>
  </div>
  <div id="end" class="panel">
    <div id="result"></div>
    <div class="row"><button id="again">もう一度</button><button id="mode"></button></div>
    <div id="renderer"></div>
  </div>
</div>
<script>window.DATA=__DATA__;</script>
<script>__THREE__</script>
<script>__MAIN__</script>
</body>
</html>
